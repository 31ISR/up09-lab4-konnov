{% extends 'layout.html' %}

{% block title %}
   New Post
{% endblock %}

{% block content %}
    <section>
        <h1>New Post</h1>
        <form class="form-with-validation" action="{% url 'posts:new-post' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %} 
            {{ form }}
            <button class="form-submit">Добавить пост</button>
        </form>
    </section>
     <style>
        .form-submit{
        transform:scale(1);
        box-shadow: 0px 1px 5px 1px #035f57;
        border-radius: 2px;
        transition: 0.2s;
        width: 150px;
        height: 50px;
        background-color: #035f57;
        margin-top: 10px;
        margin-left: 8%;
        }
        .form-submit:hover{
          transform:scale(1.05);
          box-shadow: 0px 2px 5px 2px #000000;
          transition: 0.2s;
          background-color: #23c29f; 
        }
      
        
        input[type="text"], input[type="password"] {
            width: 500px; 
            padding: 12px 20px; 
            margin: 10px 0; 
            border: 2px solid #035f57;
            border-radius: 5px; 
            transition: border-color 0.3s ease, box-shadow 0.3s ease; 
            font-size: 16px; 
            outline: none; 
        }
    
        input[type="text"]:focus, input[type="password"]:focus {
            border-color:  #035f57;
            box-shadow: 0 0 5px  #035f57;
        }
    
        input[type="text"]:hover, input[type="password"]:hover{
            border-color:  #035f57; 
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    
        h1 {
            margin-bottom: 100px;
            margin-top: 20px;
        }
</style>
{% endblock %}
