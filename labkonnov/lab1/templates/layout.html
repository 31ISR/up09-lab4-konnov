<!doctype html>
{% load static %}
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %} Приложение Django {% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}" />
        <script src="{% static 'js.js' %}" defer></script>
        <style>
            .logg{
            
                background-color: #52daad;
                border-radius: 10px;
                border: 2px solid rgb(8, 100, 50);
                width: 100px;
                height: 30px;
                margin-top: 2px;
            }
            .logg:hover {
                background-color: rgb(154, 231, 186);
            }
        </style>
    </head>
    <body>
        <div class="but">
            <li><a href="/">Главная</a></li>
            <li><a href="/about">Обо мне</a></li>
            <li><a href="{% url 'posts:list' %}"> Посты</a></li>
            <li><a href="{% url 'communities:list' %}">Сообщества</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'posts:new-post' %}">Новый пост</a></li>

                <form class="logout" action="{% url 'users:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="logg" title="User Logout">Выйти</button>
                </form>
                {% else %}
                    <li><a href="{% url 'users:register' %}">
                        Зарегистрироваться
                    </a></li>
                    <li><a href="{% url 'users:login' %}">
                        Войти
                    </a></li>
                {% endif %}
                
            </ul>
        </nav>
        <main>{% block content %} {% endblock %}</main>
        </div>
    </body>
</html>
